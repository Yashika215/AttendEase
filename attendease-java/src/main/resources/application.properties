spring.application.name=attendease
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendease}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:attendease}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:attendease_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
